<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>
            UnderConstruction
        </title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" type="text/css" href="Portfolio.css">
        <link rel="stylesheet" href="Game.css">
        <link rel="icon" href="../images/octocat.png">
        <script src="Portfolio.js" defer></script>
        <script src="Game.js" defer></script>
    </head>


    <body>
                <!--NAVBAR-->
            <div class="navbar">
                <a href="Portfolio.html">HOME</a>
                <a class="active" href="Game.html">LooneyGame</a>
                <a onclick="openForm()" ondblclick="closeForm()" class="contact">CONTACT</a>
                
                
                <!--Dark/Light Mode Toggle-->
                <button
                    id="themeToggle"
                    class="theme-toggle"
                    type="button"
                    aria-label="Switch to light mode"
                    onclick="toggleTheme()">
                    ☀
                </button>
            </div>

            <div class="Game">
                <div class="GameHeader">
                    <h1 class="Season" id="SeasonToggle">Looney Season</h1>
                    <p class="GameStatus" id="GameStatus" aria-live="polite">Start when you're ready.</p>
                    <p class="GameScore" id="GameScore">Catches: 0/10 | Misses: 0/3</p>
                    <p class="RoundTimer" id="RoundTimer" aria-live="off">Time: --</p>
                    <div class="GameControls">
                        <button type="button" id="StartGame">Start</button>
                        <button type="button" id="TryAgain" hidden>Try Again</button>
                    </div>
                </div>

                <div class="Gameboard">

                <div class="Rabbit">
                    <button
                        class="RabbitButton"
                        id="Rabbit"
                        type="button"
                        aria-label="Catch rabbit">
                        <img src="../images/rabbit.png" alt="Rabbit" class="RabbitPic">
                    </button>
                </div>

                <div class="Duck">
                    <button
                        class="DuckButton"
                        id="Duck"
                        type="button"
                        aria-label="Catch duck">
                        <img src="../images/duck.png" alt="Duck" class="DuckPic">
                    </button>
                </div>
                </div>

            </div>


            <!--Contact Section-->
        <div id="contact">
            <button onclick="openForm()" class="Pop_Up_Button">CONTACT</button>
            <!--Left column, Contact Image-->
            <div class="form-popup" id="myForm">
                <form action="https://formspree.io/f/xwkyvpqq" method="post" class="form-container">
                    <label>Name:</label>
                        <input type="text" id="Name" name="Name" placeholder="Please enter your name here" required>
                    <label>Email:</label>
                        <input type="text" id="Email" name="Email" placeholder="Please enter your email here" required>
                    <label>Message:</label>
                        <input type="text" id="Message" name="Message" placeholder="Please write your message here" required>
                        
                        <button type="submit" class="btn">SUBMIT</button>
                        <button type="button" class="btn cancel" onclick="closeForm()">CLOSE</button>
                </form>
            </div>
        </div>
    
                    <!--Footer-->
            <footer>
                Michael Roosa | mproosa1998@gmail.com | (413) 717-8058
            </footer>
    
    </body>
</html>
